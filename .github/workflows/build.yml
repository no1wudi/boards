
# Build on each commit

name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board_config: [
          ../boards/esp32/configs/nsh,
          ../boards/esp32c3/configs/nsh,
          ../boards/esp32c3/configs/usbnsh,
          ../boards/esp32s3/configs/circle,
          ../boards/esp32s3/configs/nsh,
          ../boards/esp32s3/configs/usbnsh,
          ../boards/esp32s3/configs/watch,
          ../boards/lckfb-szpi-esp32s3/configs/app,
        ]
    steps:
      - name: Checkout NuttX
        uses: actions/checkout@v4
        with:
          repository: apache/nuttx
          ref: master
          path: nuttx

      - name: Checkout NuttX Apps
        uses: actions/checkout@v4
        with:
          repository: apache/nuttx-apps
          ref: master
          path: apps

      - name: Checkout Boards
        uses: actions/checkout@v4
        with:
          path: boards

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential kconfig-frontends-nox genromfs
          sudo apt-get install -y python3 python3-pip

          pip3 install esptool==5.6.0

          mkdir -p tools
          curl -L https://github.com/espressif/crosstool-NG/releases/download/esp-16.1.0_20260609/xtensa-esp-elf-16.1.0_20260609-x86_64-linux-gnu.tar.gz | tar zxf -
          echo "$PWD/xtensa-esp-elf/bin" >> $GITHUB_PATH
          curl -L https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz | tar zxf -
          echo "$PWD/xpack-riscv-none-elf-gcc-15.2.0-1/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          cd nuttx
          tools/configure.sh ${{ matrix.board_config }}
          make -j$(nproc)
